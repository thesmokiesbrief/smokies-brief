# Builds the weekly ready-to-post images and captions every Monday at 6 a.m. Eastern. No AI.
name: Weekly posts (Mondays)

on:
  schedule:
    - cron: "0 11 * * 1"   # 11:00 UTC = 6:00 a.m. EST
  workflow_dispatch: {}

permissions:
  contents: write

# Feeds and posts both save files, so they take turns instead of racing.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: npm i playwright@1 && npx playwright install --with-deps chromium
      - name: Build posts and events feed
        run: |
          node scripts/build_events_feed.js
          node scripts/build_attractions_feed.js
          node scripts/build_posts.js
      - name: Tag new sign-ups in Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_TAG_ID: ${{ vars.KIT_TAG_ID }}
          KIT_WEEKLY_TAG_ID: ${{ vars.KIT_WEEKLY_TAG_ID }}
        run: node scripts/kit_sync.js
      - name: Send the Monday Brief (skips until Kit is connected)
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_WEEKLY_TAG_ID: ${{ vars.KIT_WEEKLY_TAG_ID }}
        run: node scripts/send_weekly.js
      - name: Save this week's posts
        run: |
          git config user.name "smokies-brief-bot"
          git config user.email "bot@thesmokiesbrief.com"
          git add posts/latest data/events.json data/attractions.json data/weekly-sent.json 2>/dev/null || git add posts/latest data/events.json data/attractions.json
          git commit -m "Weekly posts for $(date +%F)" || echo "No changes"
          git pull --rebase -X theirs origin main
          git push
