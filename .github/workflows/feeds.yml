# Rebuilds the public feeds every morning at 5:30 a.m. Eastern. No AI.
#   content.js             – "Right now" snapshot: forecast, weather alerts, park closures, today's date
#   data.js                – Market Report: Zillow home values, heat index, supply; Freddie Mac rate
#   data/rules.json        – Rules Watch: city and county agendas read for short-term rental items
#   data/events.json       – Smokies events for partner sites
#   data/attractions.json  – guest-facing Dollywood seasons, deals, tips and attraction cards
#   data/big-weekends.*    – alert dates 30 days before each big weekend, plus a calendar feed
# Then emails any alert that's due through Kit (free plan), once KIT_API_KEY and KIT_TAG_ID are set.
# Expired items drop off automatically. The 15-minute power job redeploys Pages, so changes go live within 15 minutes.
# GitHub Pages serves both files with CORS open (Access-Control-Allow-Origin: *).
name: Daily feeds

on:
  schedule:
    - cron: "34 10 * * *"   # 10:34 UTC = 5:34 a.m. EST
  workflow_dispatch: {}

permissions:
  contents: write

# Feeds and posts both save files, so they take turns instead of racing.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh the Right now snapshot (weather, park alerts, date)
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: node scripts/build_now.js || echo "Right now refresh failed; keeping the last snapshot."
      - name: Market Report (Zillow Research and Freddie Mac)
        run: node scripts/build_market.js || echo "Market Report refresh failed; keeping last month's numbers."
      - name: Rules Watch (reads city and county agendas)
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          node scripts/build_rules.js || echo "Rules Watch check failed; keeping yesterday's results."
      - name: Build feeds
        run: |
          node scripts/build_events_feed.js
          node scripts/build_attractions_feed.js
          node scripts/build_alerts.js
      - name: Tag new sign-ups in Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_TAG_ID: ${{ vars.KIT_TAG_ID }}
          KIT_WEEKLY_TAG_ID: ${{ vars.KIT_WEEKLY_TAG_ID }}
        run: node scripts/kit_sync.js
      - name: Send big weekend alerts (skips until Kit is connected)
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_TAG_ID: ${{ vars.KIT_TAG_ID }}
        run: node scripts/send_alerts.js
      - name: Save feeds
        run: |
          git config user.name "smokies-brief-bot"
          git config user.email "bot@thesmokiesbrief.com"
          git add content.js data.js index.html data/rules.json data/events.json data/attractions.json data/big-weekends.json data/big-weekends.ics data/alerts-sent.json data/unsub-done.json
          git commit -m "Daily feeds for $(date +%F)" || echo "No changes"
          git pull --rebase -X theirs origin main
          git push
