# Rebuilds the public feeds every morning at 5:30 a.m. Eastern. No AI.
#   data/events.json       – Smokies events for partner sites
#   data/attractions.json  – guest-facing Dollywood seasons, deals, tips and attraction cards
#   data/big-weekends.*    – alert dates 30 days before each big weekend, plus a calendar feed
# Then emails any alert that's due through Kit (free plan), once KIT_API_KEY and KIT_TAG_ID are set.
# Expired items drop off automatically. The 15-minute power job redeploys Pages, so changes go live within 15 minutes.
# GitHub Pages serves both files with CORS open (Access-Control-Allow-Origin: *).
name: Daily feeds

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC = 5:30 a.m. EST
  workflow_dispatch: {}

permissions:
  contents: write

# Feeds and posts both save files, so they take turns instead of racing.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build feeds
        run: |
          node scripts/build_events_feed.js
          node scripts/build_attractions_feed.js
          node scripts/build_alerts.js
      - name: Send big weekend alerts (skips until Kit is connected)
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_TAG_ID: ${{ vars.KIT_TAG_ID }}
        run: node scripts/send_alerts.js
      - name: Save feeds
        run: |
          git config user.name "smokies-brief-bot"
          git config user.email "bot@thesmokiesbrief.com"
          git add data/events.json data/attractions.json data/big-weekends.json data/big-weekends.ics data/alerts-sent.json 2>/dev/null || git add data/events.json data/attractions.json data/big-weekends.json data/big-weekends.ics
          git commit -m "Daily feeds for $(date +%F)" || echo "No changes"
          git pull --rebase -X theirs origin main
          git push
