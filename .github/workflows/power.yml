# Refreshes Sevier County Electric outage data every 15 minutes and redeploys the site.
# Free on public repos. No API keys, no AI. GitHub may delay scheduled runs by a few minutes at busy times.
name: Power outages (every 15 min)

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch SCES outage feed
        run: python scripts/fetch_power.py
      - name: Package site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' --exclude '_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
